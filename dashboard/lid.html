<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASR·EVAL — LID 检测结果</title>
<style>
:root{--bg:#d8d6cf;--panel:#f0efe9;--paper:#fbfaf6;--line:#b8b6ae;--hair:#d6d2c9;--ink:#1d1c17;--dim:#6e6c63;--faint:#979589;--orange:#e8500f;--green:#2e9d55;--red:#bf3b2b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#efeee9 0,#d8d6cf 180px);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif}
button,input,select{font:inherit}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:2px solid var(--ink)}
.top-in{max-width:1380px;margin:auto;padding:13px 20px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:.08em}.nav{display:flex;gap:20px}.nav a{color:var(--dim);text-decoration:none}.nav a:hover{color:var(--orange)}
.launcher{max-width:1340px;margin:22px auto 0}.launcher-body{padding:12px}.run-form{display:grid;grid-template-columns:minmax(190px,1.35fr) 110px 100px 130px minmax(270px,2fr) auto auto;gap:9px;align-items:end}.field{display:grid;gap:4px;min-width:0}.field span{font-size:10px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}.field input,.field select{width:100%;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:5px;padding:7px 9px;color:var(--ink)}.run-action{border:1px solid var(--ink);background:var(--ink);color:white;border-radius:5px;padding:7px 12px;cursor:pointer;white-space:nowrap}.run-action.secondary{background:transparent;color:var(--red);border-color:var(--red)}.run-action:disabled{opacity:.45;cursor:not-allowed}.job-status{min-height:21px;margin-top:9px;color:var(--dim);font-size:12px}.job-status.running{color:var(--orange)}.job-status.done{color:var(--green)}.job-status.error{color:var(--red)}.run-note{margin-top:3px;color:var(--faint);font-size:11px}
.layout{max-width:1380px;margin:14px auto 22px;padding:0 20px;display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:7px;box-shadow:inset 0 1px #fff}
.head{padding:10px 13px;border-bottom:1px solid var(--hair);font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}.runs{padding:7px;max-height:calc(100vh - 105px);overflow:auto}
.run{width:100%;border:0;border-bottom:1px solid var(--hair);background:transparent;text-align:left;padding:10px 8px;cursor:pointer}.run:hover,.run.active{background:#fff7e8}.run.active{border-left:3px solid var(--orange)}
.run-name{display:block;font-weight:650;word-break:break-all}.run-meta{display:block;color:var(--dim);font-size:11px;margin-top:3px}.content{display:grid;gap:14px}.empty{padding:42px;text-align:center;color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(110px,1fr));gap:8px;padding:12px}.stat{background:var(--paper);border:1px solid var(--hair);border-radius:6px;padding:10px}.stat b{display:block;font-size:21px}.stat span{font-size:11px;color:var(--dim)}
.chart{padding:12px}.chart-tools{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.reset{border:1px solid var(--line);background:var(--paper);border-radius:5px;padding:5px 9px;cursor:pointer}.reset.active{border-color:var(--orange);color:var(--orange)}
.bars{display:grid;gap:6px;max-height:410px;overflow:auto}.bar{display:grid;grid-template-columns:minmax(110px,220px) minmax(160px,1fr) 100px;align-items:center;gap:9px;width:100%;border:1px solid transparent;background:transparent;padding:5px;cursor:pointer;text-align:left;border-radius:5px}.bar:hover,.bar.active{background:#fff7e8;border-color:#ebc3ac}
.track{height:19px;background:#dedbd3;border-radius:3px;overflow:hidden}.fill{display:block;height:100%;background:linear-gradient(90deg,#e8500f,#f08b56);min-width:2px}.bar-value{text-align:right;font-size:12px;color:var(--dim)}
.failure{margin-top:9px;border-top:1px dashed var(--hair);padding-top:9px}.failure button{border:1px solid transparent;background:transparent;color:var(--red);cursor:pointer;border-radius:5px;padding:4px 7px}.failure button.active{border-color:var(--red);background:#fff1ed}.samples-head{padding:11px 13px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--hair)}.samples-head input{flex:1;max-width:420px;border:1px solid var(--line);background:white;border-radius:5px;padding:7px 9px}
.filter-label{color:var(--orange);font-size:12px}.cards{padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:9px}.card{background:var(--paper);border:1px solid var(--hair);border-radius:6px;padding:11px}.card-top{display:flex;justify-content:space-between;gap:8px}.prediction{white-space:nowrap}.prediction-key{color:var(--dim);font-weight:400}.prediction-value{color:var(--orange);font-weight:700}.bad{color:var(--red)}audio{width:100%;height:34px;margin:9px 0}.ref-text{margin:0 0 9px;padding:7px 8px;background:#eeece5;border-radius:4px;color:var(--dim);font-size:12px}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 12px;color:var(--dim);font-size:12px}.facts b{color:var(--ink);font-weight:600}.error{margin-top:8px;color:var(--red);word-break:break-word}
.pager{display:flex;justify-content:space-between;align-items:center;padding:10px 13px;border-top:1px solid var(--hair)}.pager button{border:1px solid var(--line);background:var(--paper);border-radius:5px;padding:5px 10px;cursor:pointer}.pager button:disabled{opacity:.4}
@media(max-width:1100px){.launcher{margin-left:20px;margin-right:20px}.run-form{grid-template-columns:repeat(4,minmax(100px,1fr))}.endpoint-field{grid-column:span 3}}
@media(max-width:850px){.run-form{grid-template-columns:repeat(2,minmax(0,1fr))}.endpoint-field{grid-column:1/-1}.layout{grid-template-columns:1fr}.runs{max-height:240px}.stats{grid-template-columns:repeat(2,1fr)}.bar{grid-template-columns:110px 1fr 75px}.nav{gap:10px}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="brand">ASR·EVAL · LID</div><nav class="nav"><a href="/">测评看板</a><a href="/review">样本复核</a></nav></div></header>
<section class="launcher panel">
  <div class="head">Run FireRedLID</div>
  <div class="launcher-body">
    <form id="lid-form" class="run-form">
      <label class="field"><span>数据集</span><select id="lid-dataset" required><option value="">读取中…</option></select></label>
      <label class="field"><span>样本数</span><input id="lid-limit" type="number" min="1" max="10000" value="100" required></label>
      <label class="field"><span>随机种子</span><input id="lid-seed" type="number" value="42" required></label>
      <label class="field"><span>实验标签</span><input id="lid-experiment" value="default" placeholder="如 fp16 / fp32"></label>
      <label class="field endpoint-field"><span>LID 服务地址</span><input id="lid-url" type="url" placeholder="http://服务名:8000" required></label>
      <button id="lid-start" class="run-action" type="submit">开始检测</button>
      <button id="lid-stop" class="run-action secondary" type="button" hidden>停止</button>
    </form>
    <div id="lid-job-status" class="job-status">填写服务地址即可从这里直接运行；同一服务的任务会串行排队。</div>
    <div class="run-note">实验标签会进入结果文件名。用相同数据集、样本数和 seed，分别填写 fp16 / fp32，即可做同清单 A/B。</div>
  </div>
</section>
<main class="layout">
  <aside class="panel"><div class="head">LID Runs</div><div id="runs" class="runs"><div class="empty">读取中…</div></div></aside>
  <section id="content" class="content"><div class="panel empty">暂无 LID 结果。先运行 eval/lid_infer.py。</div></section>
</main>
<script>
const $=s=>document.querySelector(s);
const STATE={runs:[],file:'',label:'',q:'',offset:0,limit:40,data:null,timer:null,jobId:'',jobTimer:null,lastRunsRefresh:0};
const pct=v=>v==null?'—':(Number(v)*100).toFixed(1)+'%';
const num=v=>v==null?'—':Number(v).toFixed(3).replace(/\.?0+$/,'');
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function renderRuns(){const root=$('#runs');root.replaceChildren();if(!STATE.runs.length){root.append(node('div','empty','暂无 LID 输出'));return}for(const run of STATE.runs){const b=node('button','run'+(run.file===STATE.file?' active':''));b.type='button';const title=(run.experiment?`[${run.experiment}] `:'')+(run.manifest||run.file);b.append(node('span','run-name mono',title),node('span','run-meta',`${run.summary.n_processed}/${run.summary.n_expected} 条 · ${run.summary.n_labels} 类 · ${run.file}`));b.onclick=()=>selectRun(run.file);root.append(b)}}
function stat(label,value){const d=node('div','stat');d.append(node('b','mono',value),node('span','',label));return d}
function renderSummary(data){const s=data.summary,wrap=node('div','panel'),stats=node('div','stats');stats.append(stat('已处理 / 计划',`${s.n_processed} / ${s.n_expected}`),stat('检测成功率',pct(s.coverage)),stat('预测标签数',String(s.n_labels)),stat('平均置信度',confidence(s.confidence_mean)),stat('平均 RTF',num(s.rtf_mean)));wrap.append(stats);return wrap}
function renderChart(data){const s=data.summary,wrap=node('div','panel'),head=node('div','head','Prediction Distribution'),body=node('div','chart'),tools=node('div','chart-tools'),title=node('div','',`预测标签分布 · 分母为 ${s.n_ok} 条成功结果`),reset=node('button','reset'+(!STATE.label?' active':''),'全部');reset.onclick=()=>setLabel('');tools.append(title,reset);const bars=node('div','bars');for(const item of s.labels){const b=node('button','bar'+(STATE.label===item.label?' active':''));b.type='button';const label=node('span','mono',item.label),track=node('span','track'),fill=node('span','fill');fill.style.width=(item.rate*100)+'%';track.append(fill);b.append(label,track,node('span','bar-value mono',`${item.count} · ${pct(item.rate)}`));b.onclick=()=>setLabel(item.label);bars.append(b)}body.append(tools,bars);if(s.n_fail){const fail=node('div','failure'),b=node('button',STATE.label==='__failed__'?'active':'',`请求失败 ${s.n_fail} 条 · 点击筛选`);b.onclick=()=>setLabel('__failed__');fail.append(b);body.append(fail)}wrap.append(head,body);return wrap}
function confidence(v){if(v==null)return'—';return Number(v)<=1?pct(v):num(v)}
function renderSamples(data){const wrap=node('div','panel'),head=node('div','samples-head'),input=node('input');input.placeholder='搜索样本 ID / 文本 / 参考方言 / 预测标签';input.value=STATE.q;input.oninput=()=>{clearTimeout(STATE.timer);STATE.timer=setTimeout(()=>{STATE.q=input.value;STATE.offset=0;loadResult()},250)};head.append(input,node('span','filter-label',STATE.label?`筛选：${STATE.label}`:'全部标签'));wrap.append(head);const cards=node('div','cards');for(const s of data.samples){const card=node('article','card'),top=node('div','card-top'),prediction=node('span','prediction');prediction.append(node('span','prediction-key','识别结果：'),node('span',s.ok?'prediction-value mono':'prediction-value bad',s.ok?s.display_label:'失败'));top.append(node('code','mono',s.id),prediction);card.append(top);if(s.audio_path){const a=document.createElement('audio');a.controls=true;a.preload='none';a.src='/api/audio?path='+encodeURIComponent(s.audio_path);card.append(a)}if(s.ref_text)card.append(node('p','ref-text','参考文本：'+s.ref_text));const facts=node('div','facts');for(const [k,v] of [['参考语言',s.ref_language||'—'],['参考方言',s.ref_dialect||'—'],['置信度',confidence(s.confidence)],['RTF',num(s.service_rtf)]]){const d=node('div');d.append(node('span','',k+' '),node('b','mono',v));facts.append(d)}card.append(facts);if(!s.ok)card.append(node('div','error',s.error||'检测失败'));cards.append(card)}if(!data.samples.length)cards.append(node('div','empty','没有匹配样本'));wrap.append(cards);const f=data.filter,pager=node('div','pager'),prev=node('button','','上一页'),next=node('button','','下一页');prev.disabled=f.offset<=0;next.disabled=f.offset+f.limit>=f.total;prev.onclick=()=>{STATE.offset=Math.max(0,STATE.offset-STATE.limit);loadResult()};next.onclick=()=>{STATE.offset+=STATE.limit;loadResult()};pager.append(prev,node('span','mono',`${Math.min(f.offset+1,f.total||0)}–${Math.min(f.offset+f.limit,f.total)} / ${f.total}`),next);wrap.append(pager);return wrap}
function renderContent(){const root=$('#content'),data=STATE.data;root.replaceChildren();if(!data){root.append(node('div','panel empty','选择一条 LID 运行结果'));return}root.append(renderSummary(data),renderChart(data),renderSamples(data))}
async function loadResult(){if(!STATE.file)return;const p=new URLSearchParams({file:STATE.file,label:STATE.label,q:STATE.q,offset:String(STATE.offset),limit:String(STATE.limit)}),r=await fetch('/api/lid/result?'+p),d=await r.json();if(!r.ok)throw new Error(d.error||'读取失败');STATE.data=d;renderContent()}
function setLabel(label){STATE.label=label;STATE.offset=0;loadResult().catch(showError)}
function selectRun(file){STATE.file=file;STATE.label='';STATE.q='';STATE.offset=0;renderRuns();loadResult().catch(showError)}
function showError(e){const root=$('#content');root.replaceChildren(node('div','panel empty','读取失败：'+String(e)))}
function setJobStatus(text,status=''){const el=$('#lid-job-status');el.textContent=text;el.className='job-status'+(status?' '+status:'')}
function remember(key,value){try{localStorage.setItem(key,value)}catch(_){}}
function recall(key){try{return localStorage.getItem(key)||''}catch(_){return''}}
async function loadConfig(){
  const r=await fetch('/api/lid/config'),d=await r.json();
  if(!r.ok)throw new Error(d.error||'读取 LID 配置失败');
  const select=$('#lid-dataset');select.replaceChildren();
  for(const ds of d.datasets||[]){
    const option=node('option','',`${ds.name} · ${ds.scenario}${ds.available?'':'（未下载）'}`);
    option.value=ds.id;option.disabled=!ds.available;select.append(option);
  }
  if(!select.value){const empty=node('option','','没有可运行的数据集');empty.disabled=true;select.append(empty)}
  $('#lid-limit').value=d.defaults?.limit||100;
  $('#lid-seed').value=d.defaults?.seed??42;
  $('#lid-experiment').value=d.defaults?.experiment||'default';
  $('#lid-url').value=recall('asr-eval-lid-url')||d.default_url||'';
}
async function refreshRuns(autoSelect=true){
  const r=await fetch('/api/lid/results'),d=await r.json();
  if(!r.ok)throw new Error(d.error||'读取 LID 结果失败');
  STATE.runs=d.runs||[];renderRuns();
  const stillExists=STATE.runs.some(run=>run.file===STATE.file);
  if(!stillExists&&autoSelect&&STATE.runs.length)selectRun(STATE.runs[0].file);
}
function finishJob(status,text){
  clearTimeout(STATE.jobTimer);STATE.jobTimer=null;
  $('#lid-start').disabled=false;$('#lid-stop').hidden=true;
  setJobStatus(text,status);
  if(status!=='running'){remember('asr-eval-lid-job','');STATE.jobId=''}
}
async function pollJob(){
  if(!STATE.jobId)return;
  try{
    const r=await fetch('/api/jobs'),d=await r.json(),job=(d.jobs||[]).find(item=>item.id===STATE.jobId);
    if(!r.ok)throw new Error(d.error||'读取任务状态失败');
    if(!job){finishJob('error','找不到当前 LID 任务，dashboard 可能已经重启。');return}
    const timing=job.elapsed!=null?` · 已运行 ${job.elapsed}s`:job.waiting!=null?` · 已等待 ${job.waiting}s`:'';
    const progress=job.progress?` · ${job.progress}`:'';
    setJobStatus(`${job.stage||job.status}${progress}${timing}`,'running');
    if(job.result_file&&Date.now()-STATE.lastRunsRefresh>4000){
      STATE.lastRunsRefresh=Date.now();await refreshRuns(false);
      if(STATE.runs.some(run=>run.file===job.result_file)&&STATE.file!==job.result_file)selectRun(job.result_file);
      else if(STATE.file===job.result_file)loadResult().catch(()=>{});
    }
    if(job.status==='running'){STATE.jobTimer=setTimeout(pollJob,2000);return}
    await refreshRuns(false);
    if(job.result_file&&STATE.runs.some(run=>run.file===job.result_file))selectRun(job.result_file);
    if(job.status==='done')finishJob('done',`完成 · ${job.progress||''} · 结果 ${job.result_file||''}`);
    else if(job.status==='cancelled')finishJob('',`已停止 · 已写入的成功样本仍可续跑复用`);
    else finishJob('error',`${job.stage||'运行失败'}${job.log?' · '+job.log.slice(-260):''}`);
  }catch(e){
    setJobStatus('查询任务状态失败：'+String(e),'error');
    STATE.jobTimer=setTimeout(pollJob,3000);
  }
}
async function startLid(event){
  event.preventDefault();
  const body={dataset:$('#lid-dataset').value,limit:Number($('#lid-limit').value),seed:Number($('#lid-seed').value),url:$('#lid-url').value.trim(),experiment:$('#lid-experiment').value.trim()||'default'};
  remember('asr-eval-lid-url',body.url);
  $('#lid-start').disabled=true;setJobStatus('正在派发 LID 任务…','running');
  try{
    const r=await fetch('/api/lid/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();
    if(!r.ok)throw new Error(d.error||'派发失败');
    STATE.jobId=d.job_id;remember('asr-eval-lid-job',STATE.jobId);
    $('#lid-stop').hidden=false;
    setJobStatus(d.dedup?'已有相同任务在运行，已接入其进度。':'任务已派发，等待运行…','running');
    pollJob();
  }catch(e){finishJob('error','无法开始：'+String(e))}
}
async function stopLid(){
  if(!STATE.jobId)return;
  $('#lid-stop').disabled=true;
  try{
    const r=await fetch(`/api/jobs/${encodeURIComponent(STATE.jobId)}/cancel`,{method:'POST'}),d=await r.json();
    if(!r.ok)throw new Error(d.error||'停止失败');
    setJobStatus('正在停止…','running');
  }catch(e){setJobStatus('停止失败：'+String(e),'error')}
  finally{$('#lid-stop').disabled=false}
}
async function init(){
  $('#lid-form').addEventListener('submit',startLid);$('#lid-stop').onclick=stopLid;
  await Promise.all([loadConfig(),refreshRuns(true)]);
  const savedJob=recall('asr-eval-lid-job');
  if(savedJob){STATE.jobId=savedJob;$('#lid-start').disabled=true;$('#lid-stop').hidden=false;pollJob()}
}
init().catch(showError);
</script>
</body>
</html>
